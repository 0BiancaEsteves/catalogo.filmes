<!-- Filmes -->
<div class="catalogo-section">
  <h2 class="catalogo-title">Filmes</h2>
  <div class="catalogo-grid">
    <div class="catalogo-card" *ngFor="let filme of filmes">
      <img [src]="filme.poster" [alt]="filme.titulo" style="width:150px; height:auto;">
      <h3>{{ filme.titulo }}</h3>
      <p>{{ filme.genero }}</p>
    </div>
  </div>
</div>
