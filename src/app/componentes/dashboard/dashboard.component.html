<header class="header">
  <div class="logo">
    <img src="/logo.png" alt="Logo" width="70">
    <h1>Cátalogos</h1>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Buscar" [(ngModel)]="termoBusca" (ngModelChange)="buscar()">
    <span class="search-icon" (click)="buscar()">🔍</span>
  </div>
</header>

<div class="carousel">
  <div class="carousel-image">
    <img [src]="carouselImages[currentIndex].src"
         [alt]="carouselImages[currentIndex].alt">
  </div>

  <!-- Bolinhas de navegação -->
  <div class="carousel-dots">
    <span *ngFor="let image of carouselImages; let i = index"
          (click)="goToSlide(i)"
          [class.active]="i === currentIndex"></span>
  </div>
</div>



  <!-- Filmes -->
<main>
  <!-- Seção de Filmes -->
  <section class="catalogo-section filmes">
    <h2>Filmes</h2>
    <div class="catalogo-grid">
      <div *ngFor="let filme of filmesFiltrados" class="catalogo-card">
        <img [src]="'https://image.tmdb.org/t/p/w200' + filme.poster_path" alt="{{filme.title}}">
        <h3>{{ filme.title }}</h3>
        <p>{{ filme.overview }}</p>
      </div>
    </div>
  </section>
</main>


<footer class="footer">
  <div>
    <p>© 2025 Catálogos Ford</p>
  </div>
</footer>
